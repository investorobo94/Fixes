name: Run My Pandas Script

on:
  workflow_dispatch: {}    # Allows you to click "Run" manually to test

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the script
        run: python script_b.py
