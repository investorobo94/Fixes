name: Run My Pandas Script

on:
  workflow_dispatch: {}

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the script
        run: python script_b.py

      - name: Upload amfo.csv
        uses: actions/upload-artifact@v4
        with:
          name: amfo-csv
          path: amfo.csv
          if-no-files-found: error   # fail loudly if the script didn't write it
          retention-days: 30
