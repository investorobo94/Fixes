name: Run Script A (Manual)

on:
  workflow_dispatch:        # allows manual trigger from GitHub UI / CLI
    inputs:
      commit_output:
        description: "Commit output files back to repo?"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: write           # needed if you want to commit outputs back

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run script
        run: python script_a.py

      - name: Show output files
        run: ls -la

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: script-output
          path: |
            trial.xlsx
            *.xlsx
          if-no-files-found: warn

      - name: Commit output files (optional)
        if: ${{ inputs.commit_output == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add trial.xlsx *.xlsx || true
          git diff --cached --quiet || git commit -m "Update output files from workflow run"
          git push
